
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Height and Weight Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 380px;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #333;
            font-size: 26px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4c5fd5;
        }

        .reset {
            background: #777;
        }

        .reset:hover {
            background: #555;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background: #f1f3ff;
            border-radius: 8px;
            color: #3949ab;
            font-size: 20px;
            font-weight: bold;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Height and Weight Prediction</h1>

        <form action="/predict" method="POST">

            <label for="height">Enter Your Height (in meters)</label>

            <input
                type="number"
                name="height"
                id="height"
                placeholder="Enter height (e.g. 1.70)"
                step="any"
                required
            >

            <button type="submit">
                Predict Weight
            </button>

        </form>

        <button class="reset" onclick="resetForm()">
            Reset
        </button>

        {% if prediction is not none %}

        <div class="result">
            Predicted Weight:
            <br><br>
            {{ prediction }} kg
        </div>

        {% endif %}

    </div>

    <script>
        function resetForm() {
            document.getElementById("height").value = "";
            window.location.href = "/";
        }
    </script>

</body>
</html>
